<mat-toolbar color="primary" class="flex! justify-between! px-4!">
  <span class="font-semibold tracking-tight">PolicyHub · Senior Angular Prep</span>
  <nav class="flex gap-1">
    @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-white/15!"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        class="flex items-center gap-1 rounded-md px-3 py-1.5 text-sm font-medium no-underline hover:bg-white/10"
      >
        <mat-icon class="text-base!">{{ link.icon }}</mat-icon>
        {{ link.label }}
      </a>
    }
  </nav>
</mat-toolbar>

<main class="mx-auto max-w-5xl px-4 py-8">
  <router-outlet />
</main>
