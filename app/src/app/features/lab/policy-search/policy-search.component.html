<div class="mb-3 flex items-center justify-between text-sm">
  <a routerLink="/lab" class="text-blue-600 hover:underline">← Refactor Lab</a>
  <span class="text-xs text-slate-500">
    Legacy (no rutable, abrila en tu editor):
    <code class="rounded bg-amber-50 px-1 py-0.5 text-amber-800">
      policy-search/legacy/policy-search-legacy.service.ts
    </code>
  </span>
</div>

<div class="rounded-lg border border-slate-200 bg-white p-4">
  <input
    type="text"
    placeholder="Buscar por titular (probá 'an' y después 'ana' rápido)..."
    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
    (input)="onSearch($any($event.target).value)"
  />
  <ul class="mt-3 flex flex-col gap-2 text-sm">
    @for (result of store.results(); track result.id) {
      <li class="rounded-md border border-slate-200 px-3 py-2">
        {{ result.holderName }} · {{ result.policyNumber }}
      </li>
    } @empty {
      <li class="text-slate-500">Sin resultados todavía.</li>
    }
  </ul>
</div>
