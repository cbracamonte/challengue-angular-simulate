<div class="mb-6 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
  <a
    routerLink="/lab"
    class="inline-flex items-center gap-1 text-sm font-medium text-slate-500 transition-colors hover:text-blue-600"
  >
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M12.79 5.23a.75.75 0 0 1 0 1.06L9.06 10l3.73 3.71a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
        clip-rule="evenodd"
      />
    </svg>
    Refactor Lab
  </a>
  <div class="inline-flex flex-wrap items-center gap-2 rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-medium text-amber-700">
    <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-amber-500"></span>
    Legacy (no rutable, abrila en tu editor):
    <code class="font-mono text-amber-800">policy-search/legacy/policy-search-legacy.service.ts</code>
  </div>
</div>

<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <input
    type="text"
    placeholder="Buscar por titular (probá 'an' y después 'ana' rápido)..."
    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none"
    (input)="onSearch($any($event.target).value)"
  />
  <ul class="mt-4 flex flex-col gap-2 text-sm">
    @for (result of store.results(); track result.id) {
      <li class="rounded-lg border border-slate-200 px-3 py-2.5 transition-colors hover:border-blue-300 hover:bg-blue-50/40">
        <span class="font-medium text-slate-900">{{ result.holderName }}</span>
        <span class="text-slate-500"> · {{ result.policyNumber }}</span>
      </li>
    } @empty {
      <li class="rounded-lg border border-dashed border-slate-300 px-3 py-3 text-slate-500">
        Sin resultados todavía.
      </li>
    }
  </ul>
</div>
