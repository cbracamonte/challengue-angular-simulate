<div class="mb-6 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
  <a
    routerLink="/lab"
    class="inline-flex items-center gap-1 text-sm font-medium text-slate-500 transition-colors hover:text-blue-600"
  >
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M12.79 5.23a.75.75 0 0 1 0 1.06L9.06 10l3.73 3.71a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
        clip-rule="evenodd"
      />
    </svg>
    Refactor Lab
  </a>
  <a
    routerLink="/lab/policy-list"
    class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 transition-colors hover:border-emerald-300 hover:bg-emerald-100"
  >
    ← Volver a tu implementación moderna
  </a>
</div>

<div class="rounded-xl border border-amber-200 bg-amber-50/60 p-5 shadow-sm">
  <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-800">
    Legacy (read-only)
  </span>
  <table class="mt-4 w-full text-left text-sm">
    <thead>
      <tr class="text-xs font-semibold tracking-wide text-slate-500 uppercase">
        <th class="pb-2 font-semibold">ID</th>
        <th class="pb-2 font-semibold">Titular</th>
        <th class="pb-2 font-semibold">Prima</th>
        <th class="pb-2 font-semibold">Estado</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-amber-100">
      <tr *ngFor="let policy of policies">
        <td class="py-2 font-mono text-xs text-slate-500">{{ policy.id }}</td>
        <td class="py-2 text-slate-800">{{ policy.holderName }}</td>
        <td class="py-2 text-slate-800">{{ policy.premium }}</td>
        <td class="py-2">
          <span
            *ngIf="policy.status === 'active'"
            class="inline-flex items-center rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-700"
            >Activa</span
          >
          <span
            *ngIf="policy.status === 'pending'"
            class="inline-flex items-center rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-700"
            >Pendiente</span
          >
          <span
            *ngIf="policy.status === 'cancelled'"
            class="inline-flex items-center rounded-full bg-slate-200 px-2 py-0.5 text-xs font-medium text-slate-600"
            >Cancelada</span
          >
        </td>
      </tr>
    </tbody>
  </table>
  <p class="mt-4 border-t border-amber-100 pt-3 text-sm font-semibold text-slate-800">
    Total: <span class="text-amber-700">{{ totalPremium() }}</span>
  </p>
</div>
