<div class="mb-3 flex items-center justify-between text-sm">
  <a routerLink="/lab" class="text-blue-600 hover:underline">← Refactor Lab</a>
  <a routerLink="/lab/policy-list" class="font-medium text-green-700 hover:underline">
    ← Volver a tu implementación moderna
  </a>
</div>

<div class="rounded-lg border border-amber-300 bg-amber-50 p-4">
  <p class="mb-3 text-xs font-semibold tracking-wide text-amber-800 uppercase">Legacy (read-only)</p>
  <table class="w-full text-left text-sm">
    <thead>
      <tr>
        <th>ID</th>
        <th>Titular</th>
        <th>Prima</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let policy of policies">
        <td>{{ policy.id }}</td>
        <td>{{ policy.holderName }}</td>
        <td>{{ policy.premium }}</td>
        <td *ngIf="policy.status === 'active'">Activa</td>
        <td *ngIf="policy.status === 'pending'">Pendiente</td>
        <td *ngIf="policy.status === 'cancelled'">Cancelada</td>
      </tr>
    </tbody>
  </table>
  <p class="mt-3 text-sm font-medium">Total: {{ totalPremium() }}</p>
</div>
