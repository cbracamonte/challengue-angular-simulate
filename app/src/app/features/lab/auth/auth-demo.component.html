<div class="rounded-lg border border-green-300 bg-green-50 p-4">
  <p class="mb-3 text-xs font-semibold tracking-wide text-green-800 uppercase">TokenStore (demo manual)</p>
  <p class="text-sm">
    Sesión: <strong>{{ tokenStore.isAuthenticated() ? 'autenticado' : 'sin sesión' }}</strong>
  </p>
  <div class="mt-3 flex gap-2">
    <button mat-flat-button color="primary" (click)="simulateLogin()">Simular login</button>
    <button mat-stroked-button (click)="logout()">Logout</button>
  </div>
  <p class="mt-3 text-xs text-slate-500">
    Este panel es solo para inspeccionar el TokenStore a mano. Los tests reales de interceptor
    y guard están en auth.interceptor.spec.ts y auth.guard.spec.ts.
  </p>
</div>
